name: Feature request
description: Propose a focused capability or API improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What cannot be done cleanly today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Scope
      options: [Cross-platform, Android, iOS, Web, Generator, Inspector]
    validations:
      required: true
