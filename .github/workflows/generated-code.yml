name: Generated code integration

on:
  pull_request:
    paths:
      - 'native_sqlite/**'
      - 'native_sqlite_annotations/**'
      - 'native_sqlite_generator/**'
      - 'example/**'
      - 'tool/test_generated_code.sh'
      - '.github/workflows/generated-code.yml'
  push:
    branches: [main, master]
    paths:
      - 'native_sqlite/**'
      - 'native_sqlite_annotations/**'
      - 'native_sqlite_generator/**'
      - 'example/**'
      - 'tool/test_generated_code.sh'
      - '.github/workflows/generated-code.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-test-and-compile:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Generate, test, and compile Dart, Kotlin, and Swift
        env:
          NATIVE_SQLITE_CHECK_GENERATED_DIFF: '1'
        run: ./tool/test_generated_code.sh
