name: native_sqlite_workspace
description: Workspace root for the native_sqlite monorepo.
publish_to: none

environment:
  sdk: '>=3.9.0 <4.0.0'

workspace:
  - native_sqlite/native_sqlite
  - native_sqlite/native_sqlite_android
  - native_sqlite/native_sqlite_ios
  - native_sqlite/native_sqlite_web
  - native_sqlite/native_sqlite_platform_interface
  - native_sqlite_annotations
  - native_sqlite_generator
  - native_sqlite_inspector
  - example

dev_dependencies:
  crypto: ^3.0.6
  melos: ^7.0.0

melos:
  repository: https://github.com/nesmin/native_sqllite

  command:
    version:
      branch: main
      linkToCommits: true
      updateGitTagRefs: true
      workspaceChangelog: true
      message: |
        chore(release): publish packages

        {new_package_versions}

  scripts:
    analyze:
      run: flutter pub run melos exec --fail-fast -- flutter analyze
      description: Run flutter analyze in all Flutter packages
      packageFilters:
        flutter: true

    analyze:dart:
      run: flutter pub run melos exec --fail-fast -- dart analyze
      description: Run dart analyze in pure Dart packages
      packageFilters:
        flutter: false

    test:flutter:
      run: flutter pub run melos exec --concurrency=1 --fail-fast -- flutter test
      description: Run tests in Flutter packages
      packageFilters:
        flutter: true
        dirExists: test

    test:generator:
      run: tool/test_generator.sh
      description: Run the generator suite with its direct test runner

    test:all:
      description: Run every Flutter and generator test suite
      steps:
        - flutter pub run melos run test:flutter --no-select
        - flutter pub run melos run test:generator

    fmt:
      run: flutter pub run melos exec --fail-fast -- dart format .
      description: Format all Dart files

    fmt:check:
      run: flutter pub run melos exec --fail-fast -- dart format --output=none --set-exit-if-changed .
      description: Check formatting without making changes (CI)

    build:runner:
      run: flutter pub run melos exec --fail-fast -- flutter pub run build_runner build
      description: Run build_runner in packages that use code generation
      packageFilters:
        dependsOn: build_runner

    build:runner:watch:
      run: flutter pub run melos exec --concurrency=1 --fail-fast -- flutter pub run build_runner watch
      description: Run build_runner in watch mode
      packageFilters:
        dependsOn: build_runner

    clean:all:
      run: flutter pub run melos exec --fail-fast -- flutter clean
      description: Run flutter clean in all Flutter packages
      packageFilters:
        flutter: true
